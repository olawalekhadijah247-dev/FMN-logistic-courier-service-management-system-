:root{
  --navy:#102a43; --navy2:#163f63; --orange:#f28c28; --orange2:#d97706;

*{box-sizing:border-box}

#loginPage{max-width:420px;margin:55px auto;padding:28px;background:white;border-radius:15px;box-shadow:var(--shadow)}
